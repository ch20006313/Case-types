<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幾米風 - 藝術案件導覽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@400;600&display=swap" rel="stylesheet">
<style>
  /* --- 基礎質感設定 --- */
  body {
    background-color: #fdfaf3; /* 偏暖的米白水彩紙底色 */
    font-family: 'Klee One', '標楷體', cursive;
    color: #4a555c;
    margin: 0;
    padding: 40px;
    /* 加上淡淡的紙張紋路感 */
    background-image: radial-gradient(#d6d0c4 1px, transparent 1px);
    background-size: 30px 30px;
  }

  /* --- 頂部導覽列 --- */
  .header-container {
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 900px;
    margin: 0 auto 40px auto;
    border-bottom: 2px dashed #c8c0b4;
    padding-bottom: 20px;
  }

  .header-title {
    font-size: 32px;
    font-weight: 600;
    letter-spacing: 3px;
    margin: 0;
    color: #637a70; /* 柔和的莫蘭迪綠 */
  }

  /* --- 搜尋框美化 --- */
  .search-box {
    padding: 12px 20px;
    font-size: 18px;
    border: 2px solid #d4ccbe;
    /* 實作幾米風不規則手繪感邊框 */
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px; 
    background-color: rgba(255, 255, 255, 0.6);
    color: #4a555c;
    outline: none;
    transition: all 0.4s ease;
    width: 260px;
    font-family: inherit;
  }

  .search-box:focus {
    border-color: #f2a65a; /* 溫暖的夕陽橘 */
    background-color: #ffffff;
    box-shadow: 0 4px 15px rgba(242, 166, 90, 0.2);
  }

  /* --- 案件列表設定 --- */
  .item-list {
    list-style-type: none;
    padding: 0;
    max-width: 900px;
    margin: 0 auto;
  }

  .item {
    margin-bottom: 20px;
    transition: opacity 0.5s ease, transform 0.5s ease;
  }

  /* --- 單個案件連結美化 (手繪風格) --- */
  .item a {
    display: block;
    padding: 22px 30px;
    background-color: #ffffff;
    /* 實作幾米風不規則手繪感邊框 */
    border-radius: 255px 15px 225px 15px/15px 225px 15px 255px;
    border: 1px solid #eae5d9;
    text-decoration: none;
    color: #5c6b73;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: 2px;
    box-shadow: 2px 4px 10px rgba(0, 0, 0, 0.02);
    transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
    position: relative;
    overflow: hidden;
    z-index: 1;
  }

  /* 水彩暈染的偽元素 (背景漸層) */
  .item a::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    background: linear-gradient(120deg, #fdfaf3 0%, #e8f0e9 50%, #fbe8d5 100%);
    opacity: 0;
    z-index: -1;
    transition: opacity 0.6s ease;
  }

  /* 懸浮效果：水彩暈染與微微上浮 */
  .item a:hover {
    transform: translateY(-4px) rotate(-0.5deg); /* 加入微小的傾斜增加手作感 */
    box-shadow: 4px 8px 20px rgba(99, 122, 112, 0.15);
    color: #2b3940;
    border-color: #cdd6d0;
  }

  .item a:hover::before {
    opacity: 1; /* 觸發水彩漸層浮現 */
  }

  /* 隱藏元素時的動畫過渡類別 */
  .item.hidden {
    opacity: 0;
    transform: translateY(15px) scale(0.98);
    pointer-events: none;
    position: absolute;
  }
</style>
</head>
<body>

  <div class="header-container">
    <h1 class="header-title">公辦重劃：案件列表</h1>
    <input type="text" id="searchInput" class="search-box" placeholder="尋找記憶中的案件...">
  </div>

  <ul class="item-list" id="itemList">
    <li class="item"><a href="#link1">115年高雄市第108期公辦市地重劃</a></li>
    <li class="item"><a href="#link2">115年高雄市第110期公辦市地重劃</a></li>
    <li class="item"><a href="#link3">115年高雄市第112期公辦市地重劃</a></li>
    <li class="item"><a href="#link4">115年高雄市第***期公辦市地重劃</a></li>
    <li class="item"><a href="#link5">114年高雄市第106期公辦市地重劃</a></li>
    <li class="item"><a href="#link6">114年高雄市第***期公辦市地重劃</a></li>

  </ul>

  <script>
    const searchInput = document.getElementById('searchInput');
    const items = document.querySelectorAll('.item');

    searchInput.addEventListener('input', function() {
      const keyword = this.value.toLowerCase().trim();

      items.forEach(item => {
        const text = item.textContent.toLowerCase();
        if (text.includes(keyword)) {
          item.style.display = 'block'; 
          setTimeout(() => item.classList.remove('hidden'), 10);
        } else {
          item.classList.add('hidden');
          setTimeout(() => {
            if (item.classList.contains('hidden')) {
              item.style.display = 'none';
            }
          }, 500); 
        }
      });
    });
  </script>

</body>
</html>
